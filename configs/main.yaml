# Main config — override individual keys from CLI:
# python scripts/02_finetune.py model=qlora_4bit training.epochs=1
#
# SUPERSEDED PRE-RUN PLAN ONLY. The executed manifest is
# configs/executed_run.yaml. The completed downstream
# run did not use the routing counts below; it used 8,000 / 2,000 / 3,307 as
# recorded in results/routing_metrics.json. Do not cite this file as the
# executed downstream manifest.

defaults:
  - model: lora_fp16
  - data: datasets

seed: 42

paths:
  data_raw:      data/raw
  data_splits:   data/splits
  data_features: data/features
  checkpoints:   checkpoints
  results:       results
  figures:       figures

# NOTE: Fine-tuning parameters are in separate finetune config files. This
# planning block predates the recorded run.
training:
  epochs: 3
  batch_size: 2           # per_device; effective batch = 2×8 = 16 (matches finetune_config)
  grad_accum: 8
  lr: 2e-4
  warmup_ratio: 0.06
  lr_scheduler: cosine
  max_seq_len: 512
  logging_steps: 50
  save_strategy: steps
  save_total_limit: 3
  report_to: wandb        # set to "none" to disable W&B

probe:
  n_splits: 5
  Cs: [0.001, 0.01, 0.1, 1.0, 10.0]
  layer_sweep: [8, 16, 24, 30, 31]   # L//4, L//2, 3L//4, L-2, L-1

superseded_planned_routing:
  train_size: 12000
  iso_cal_size: 4000
  correlation_threshold: 0.85  # drop gap if r(H, gap) > this

conformal:
  alphas: [0.05, 0.10, 0.15, 0.20]
  primary_alpha: 0.10
  n_bootstrap: 1000

evaluation:
  n_bootstrap: 1000
  ece_bins: 15
